<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Drill2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-image: url(https://static.vecteezy.com/system/resources/thumbnails/075/030/209/small/warm-gradient-background-with-yellow-orange-and-red-hues-photo.jpg);
            background-size: cover;
        }
    </style>
</head>

<body>

<center>

    <br><br>
    <div class="container-fluid col-lg-6 fs-4 bg-dark rounded">
        <br>
        <h2 class="text-warning">Heat Index Checker</h2>
         <details ontoggle="message1()">
            <summary>
                <u class="text-light" style="text-align: center;">Instructions</u>
            </summary>
            <br>
            <i id="message" class="text-light"></i>
        </details>
        <br>
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <p class="text-light">Degree In C</p>
                <input type="number" class="form-control" id="temp" placeholder="Enter...">
                <br>
                <p class="text-light">Humidity In %</p>
                <input type="number" class="form-control" id="humid" placeholder="Enter...">
                <br>
                <button type="btn btn-success" onclick="HeatIndex()">Check</button>
            </div>
        </div>
    </div>
    <br><br><br>
    </div>
    





    <script>
        function message1(){
        document.getElementById("message").innerHTML = "Input both the required numbers then click the 'Check' button below.";
        }
        function HeatIndex() {
            let temp, humidity, HI, status;
            temp = parseFloat(document.getElementById("temp").value);
            humidity = parseFloat(document.getElementById("humid").value);

            HI = temp + (0.33 * humidity) - 4;
            status = "";

            switch (true) {
                case (HI <= 27):
                    alert("Comfortable/Cool");
                    break;
                case (HI <= 32):
                    alert("Warm");
                    break;
                case (HI <= 37):
                    alert("Hot");
                    break;
                case (HI <= 41):
                    alert("Very Hot/Caution");
                    break;
                case (HI >= 42):
                    alert("Extreme Heat/Danger");
                    break;
            }
        }
    </script>

</center>

</body>

</html>
